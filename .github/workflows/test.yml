name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
