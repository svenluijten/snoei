version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/snoei
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: snoei
    repository:
      owner: svenluijten
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/svenluijten/snoei
    description: Remove local branches and worktrees that were already merged on GitHub
    license: MIT
    hooks:
      post:
        # The binary is not notarized, so macOS would otherwise refuse to run it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/snoei"]
          end
